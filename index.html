<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRO — MATERIA OSCURA</title>
<meta name="description" content="ASTRO — MATERIA OSCURA. Nueva colección.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;background:#000;color:#fff}
.page{
 position:relative;width:100vw;height:100vh;overflow:hidden;
 display:flex;align-items:center;justify-content:center;background:#000
}
.noise{
 position:absolute;inset:-50%;opacity:.055;pointer-events:none;
 background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
 transform:rotate(7deg)
}
.stars{
 position:absolute;inset:0;pointer-events:none;
 background-image:
 radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.5px),
 radial-gradient(circle,rgba(255,255,255,.4) 0 1px,transparent 1.4px),
 radial-gradient(circle,rgba(255,255,255,.3) 0 1px,transparent 1.5px);
 background-size:97px 113px,157px 181px,211px 149px;
 background-position:12px 23px,72px 61px,31px 101px;
 opacity:.22;animation:drift 18s linear infinite
}
@keyframes drift{to{background-position:109px 136px,229px 207px,142px 3px}}

.logo{
 position:absolute;top:27px;left:50%;transform:translateX(-50%);
 width:min(370px,48vw);z-index:3;
 filter:drop-shadow(0 0 16px rgba(255,255,255,.08))
}
.logo img{display:block;width:100%;height:auto}

.center{
 position:relative;z-index:2;width:min(900px,92vw);text-align:center
}
.kicker{
 font-size:11px;font-weight:700;letter-spacing:.55em;
 text-transform:uppercase;margin-bottom:27px;color:#bdbdbd
}
.collection{
 font-size:clamp(42px,9vw,104px);line-height:.9;font-weight:900;
 letter-spacing:-.055em;text-transform:uppercase;
 text-shadow:0 0 55px rgba(255,255,255,.09)
}
.sub{
 margin-top:19px;font-size:12px;letter-spacing:.42em;
 text-transform:uppercase;color:#777
}
.countdown{
 margin:44px auto 0;display:grid;grid-template-columns:repeat(4,1fr);
 max-width:690px;border-top:1px solid rgba(255,255,255,.22);
 border-bottom:1px solid rgba(255,255,255,.22);padding:22px 0 20px
}
.unit{display:flex;flex-direction:column;gap:8px}
.number{font-size:clamp(30px,5vw,55px);font-weight:700;letter-spacing:-.04em}
.label{font-size:9px;letter-spacing:.35em;color:#777;text-transform:uppercase}
.sep{position:relative}
.sep:after{content:":";position:absolute;right:0;top:8px;color:#444;font-size:26px}
.cta{
 display:inline-flex;margin-top:36px;padding:13px 25px;
 border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;
 font-size:10px;letter-spacing:.28em;text-transform:uppercase;transition:.25s
}
.cta:hover{background:#fff;color:#000;border-color:#fff}
.bottom{
 position:absolute;bottom:25px;left:0;right:0;text-align:center;
 font-size:8px;letter-spacing:.38em;color:#414141;text-transform:uppercase
}
@media(max-width:560px){
 .logo{top:23px;width:min(300px,68vw)}
 .kicker{font-size:8px;letter-spacing:.38em}
 .collection{font-size:47px}
 .countdown{margin-top:35px}
 .number{font-size:31px}
 .label{font-size:7px;letter-spacing:.2em}
 .sub{font-size:8px;letter-spacing:.28em}
 .cta{margin-top:30px}
}
</style>
</head>
<body>
<div class="page">
 <div class="stars"></div>
 <div class="noise"></div>

 <div class="logo">
   <img src="astro-logo.png" alt="ASTRO">
 </div>

 <main class="center">
   <div class="kicker">Nueva colección</div>
   <h1 class="collection">Materia Oscura</h1>
   <div class="sub">10 · 01 · 2027</div>

   <div class="countdown" id="countdown">
     <div class="unit sep"><span class="number" id="days">00</span><span class="label">Días</span></div>
     <div class="unit sep"><span class="number" id="hours">00</span><span class="label">Horas</span></div>
     <div class="unit sep"><span class="number" id="minutes">00</span><span class="label">Minutos</span></div>
     <div class="unit"><span class="number" id="seconds">00</span><span class="label">Segundos</span></div>
   </div>

   <a class="cta" href="#" onclick="return false;">Próximamente</a>
 </main>

 <div class="bottom">ASTRO · MATERIA OSCURA · 2027</div>
</div>

<script>
const target = new Date("2027-01-10T00:00:00-05:00").getTime();

function updateCountdown(){
 let diff=target-Date.now();
 if(diff<=0){
   document.getElementById("countdown").innerHTML=
   '<div style="grid-column:1/-1;font-size:14px;letter-spacing:.35em;text-transform:uppercase;">Materia Oscura está aquí</div>';
   return;
 }
 const d=Math.floor(diff/86400000);
 const h=Math.floor((diff%86400000)/3600000);
 const m=Math.floor((diff%3600000)/60000);
 const s=Math.floor((diff%60000)/1000);
 document.getElementById("days").textContent=String(d).padStart(2,"0");
 document.getElementById("hours").textContent=String(h).padStart(2,"0");
 document.getElementById("minutes").textContent=String(m).padStart(2,"0");
 document.getElementById("seconds").textContent=String(s).padStart(2,"0");
}
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
